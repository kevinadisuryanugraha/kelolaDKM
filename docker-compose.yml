services:
  # Backend Laravel API Service
  api:
    build:
      context: ./keloladkm-api
      dockerfile: Dockerfile
    container_name: keloladkm_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:29uMDebx1ljdBmxtza0QGox867pF3iFlPhXCVJ0SoD0=
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./keloladkm-api/database:/var/www/html/database
      - ./keloladkm-api/storage:/var/www/html/storage
    ports:
      - "8000:8000"
    networks:
      - keloladkm_net

  # Frontend Web & PWA (Nginx)
  web:
    build:
      context: ./keloladkm
      dockerfile: Dockerfile
    container_name: keloladkm_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - keloladkm_net

networks:
  keloladkm_net:
    driver: bridge

volumes:
  certbot_certs:
