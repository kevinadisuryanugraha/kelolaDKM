# Nginx rate limiting configuration for KelolaDKM
# Place this inside the server { } block for keloladkm.masjidnuruliman-pejaten.or.id

# Define rate limit zones (in nginx.conf http block or outside server block)
# limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# ── Inside server block ──

# Rate limit /api/login — 5 requests per minute per IP
location /api/login {
    limit_req zone=login_limit burst=3 nodelay;
    limit_req_status 429;

    # Proxy to Laravel backend
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# General API rate limit — 30 requests per minute
location /api/ {
    limit_req zone=api_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
